<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Múltiplo de PDF para Excel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Conversor em Lote de PDF para Excel</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Selecione múltiplos arquivos. Cada um gerará um Excel, baixados juntos em um arquivo .zip.</p>
        
        <div class="mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Selecione os arquivos PDF:</label>
            <input type="file" id="pdfFiles" accept="application/pdf" multiple class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button id="convertBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 cursor-pointer mb-4">
            Converter e Baixar Arquivos
        </button>
        
        <div id="progressStatus" class="text-center text-sm text-gray-600 hidden">
            Processando... <span id="progressCount">0/0</span>
        </div>

        <p class="text-xs text-gray-400 mt-6 text-center border-t pt-4">Nenhum dado é salvo em servidores. Todo o processamento ocorre localmente no seu navegador.</p>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.getElementById('convertBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('pdfFiles');
            if (fileInput.files.length === 0) {
                alert('Selecione pelo menos um arquivo PDF.');
                return;
            }

            const statusDiv = document.getElementById('progressStatus');
            const progressCount = document.getElementById('progressCount');
            statusDiv.classList.remove('hidden');

            const zip = new JSZip();
            const files = Array.from(fileInput.files);
            let total = files.length;
            let current = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressCount.innerText = `${current + 1}/${total}`;

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    
                    let combinedText = "";
                    for (let p = 1; p <= pdf.numPages; p++) {
                        const page = await pdf.getPage(p);
                        const textContent = await page.getTextContent();
                        combinedText += textContent.items.map(item => item.str).join(' ') + " ";
                    }

                    // Limpa espaços extras para facilitar a separação
                    const cleanText = combinedText.replace(/\s+/g, ' ').trim();

                    // Cria um array de dados organizados em linhas
                    const rows = [
                        ["Relatório de Rendimento"],
                        ["Conteúdo Extraído"],
                        [cleanText]
                    ];

                    const worksheet = XLSX.utils.aoa_to_sheet(rows);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Dados");

                    // Gera o arquivo como um Blob binário válido
                    const excelBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                    const blob = new Blob([excelBuffer], { 
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' 
                    });

                    const baseName = file.name.replace(/\.pdf$/i, '');
                    zip.file(`${baseName}.xlsx`, blob);
                } catch (err) {
                    console.error('Erro ao processar ' + file.name, err);
                }
                current++;
            }

            progressCount.innerText = `Gerando ZIP...`;

            zip.generateAsync({ type: 'blob' }).then((content) => {
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = total > 1 ? 'documentos_convertidos.zip' : `${files[0].name.replace(/\.pdf$/i, '')}.xlsx`;
                a.click();
                URL.revokeObjectURL(url);
                statusDiv.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
